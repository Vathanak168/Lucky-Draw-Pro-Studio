<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asta Output</title>
    <link rel="icon" type="image/svg+xml" href="../assets/asta-mark.svg">
    <script src="../js/runtime_session.js?v=1.0.0"></script>
    <link rel="stylesheet" href="../styles/virtual_stage.css?v=7.5.0">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000;
        }
        #stageOutputScreen {
            width: 100vw; height: 100vh;
        }
    </style>
</head>
<body>
    <!-- The outer viewport window mirroring the 16:9 Video Player bounds -->
    <div id="stageOutputScreen" class="stage-viewport">
        <!-- Fixed 1920x1080 virtual stage shell transformed via ResizeObserver -->
        <div class="virtual-canvas-shell">
            <div id="virtualCanvas" class="virtual-canvas">
                <div class="virtual-stage-bg" id="virtualStageBg"></div>
                <div class="virtual-winner-grid" id="virtualWinnerGrid"></div>
            </div>
        </div>
    </div>

    <script src="../js/engine/virtual_scaler.js?v=7.5.0"></script>
    <script src="projector.js?v=7.5.0"></script>
</body>
</html>
